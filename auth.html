<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up or Log In · Super App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Surfaces */
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --surface-sunken: #F2F2F2;
      --surface-hover: #F5F5F5;
      --surface-active: #EDEDED;

      /* Borders */
      --border: #EAEAEA;
      --border-strong: #D4D4D4;
      --border-control: #A3A3A3;

      /* Text */
      --text-primary: #111111;
      --text-secondary: #5C5C5C;
      --text-placeholder: #737373;

      /* Accent (the only brand color) */
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-active: #1E40AF;
      --accent-soft: #EFF4FF;
      --accent-text: #1D4ED8;
      --accent-ring: rgba(37, 99, 235, 0.20);
      --on-accent: #FFFFFF;

      /* Status */
      --success: #15803D;
      --success-soft: #F0FDF4;
      --error: #B91C1C;
      --error-soft: #FEF2F2;
      --error-ring: rgba(185, 28, 28, 0.18);

      /* Disabled */
      --disabled-bg: #F2F2F2;
      --disabled-text: #8A8A8A;

      /* Effects */
      --scrim: rgba(0, 0, 0, 0.40);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, 0.08);

      /* Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 999px;

      /* Spacing */
      --sp-4: 0.25rem;
      --sp-8: 0.5rem;
      --sp-12: 0.75rem;
      --sp-16: 1rem;
      --sp-24: 1.5rem;
      --sp-32: 2rem;
      --sp-48: 3rem;
      --nav-h: 4rem;

      --font: "Inter", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A0A0A;
        --surface: #141414;
        --surface-sunken: #1F1F1F;
        --surface-hover: #1A1A1A;
        --surface-active: #262626;
        --border: #262626;
        --border-strong: #3A3A3A;
        --border-control: #6B6B6B;
        --text-primary: #EDEDED;
        --text-secondary: #A3A3A3;
        --text-placeholder: #8A8A8A;
        --accent: #60A5FA;
        --accent-hover: #93C5FD;
        --accent-active: #BFDBFE;
        --accent-soft: #16233F;
        --accent-text: #93C5FD;
        --accent-ring: rgba(96, 165, 250, 0.30);
        --on-accent: #0A0A0A;
        --success: #4ADE80;
        --success-soft: #0F2A1A;
        --error: #F87171;
        --error-soft: #331416;
        --error-ring: rgba(248, 113, 113, 0.25);
        --disabled-bg: #1F1F1F;
        --disabled-text: #6B6B6B;
        --scrim: rgba(0, 0, 0, 0.60);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.40);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.40);
        --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, 0.50);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0A0A0A;
      --surface: #141414;
      --surface-sunken: #1F1F1F;
      --surface-hover: #1A1A1A;
      --surface-active: #262626;
      --border: #262626;
      --border-strong: #3A3A3A;
      --border-control: #6B6B6B;
      --text-primary: #EDEDED;
      --text-secondary: #A3A3A3;
      --text-placeholder: #8A8A8A;
      --accent: #60A5FA;
      --accent-hover: #93C5FD;
      --accent-active: #BFDBFE;
      --accent-soft: #16233F;
      --accent-text: #93C5FD;
      --accent-ring: rgba(96, 165, 250, 0.30);
      --on-accent: #0A0A0A;
      --success: #4ADE80;
      --success-soft: #0F2A1A;
      --error: #F87171;
      --error-soft: #331416;
      --error-ring: rgba(248, 113, 113, 0.25);
      --disabled-bg: #1F1F1F;
      --disabled-text: #6B6B6B;
      --scrim: rgba(0, 0, 0, 0.60);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.40);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.40);
      --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, 0.50);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 100%; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font: 400 1rem/1.5rem var(--font);
      -webkit-font-smoothing: antialiased;
    }
    .num { font-variant-numeric: tabular-nums; }
    button, input, select, textarea { font: inherit; color: inherit; }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
    }
    @media (min-width: 480px) {
      body { background: var(--surface-sunken); }
      .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }

    .screen {
      padding: 0 var(--sp-16) var(--sp-24);
      display: flex;
      flex-direction: column;
      gap: var(--sp-24);
    }

    .app-header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12);
      min-height: 3.5rem; padding: var(--sp-8) var(--sp-16); margin: 0 calc(var(--sp-16) * -1);
    }
    .app-header__title { flex: 1; min-width: 0; }

    .icon-btn {
      display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px;
      background: transparent; color: var(--text-primary); border: 0; border-radius: var(--radius-full); cursor: pointer; text-decoration: none;
    }
    .icon-btn:hover { background: var(--surface-hover); }
    .icon-btn:active { background: var(--surface-active); }
    .icon-btn svg { width: 24px; height: 24px; }

    h1, .t-h1 { font: 600 1.75rem/2.125rem var(--font); letter-spacing: -0.0375rem; margin: 0; }
    p { margin: 0; }
    .t-small { font: 400 0.875rem/1.25rem var(--font); }
    .t-muted { color: var(--text-secondary); }
    .link { color: var(--accent-text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .link:hover { color: var(--accent-hover); }
    .text-center { text-align: center; }

    .segmented { display: flex; gap: var(--sp-4); padding: var(--sp-4); background: var(--surface-sunken); border-radius: var(--radius-md); }
    .segmented > a, .segmented > button {
      flex: 1; min-height: 2.75rem; height: 2.75rem; border: 0; border-radius: var(--radius-sm); cursor: pointer;
      background: transparent; color: var(--text-secondary); font: 500 .875rem/1.25rem var(--font);
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .segmented > a.is-active, .segmented > button[aria-selected="true"] {
      background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow-sm);
    }

    .field { display: flex; flex-direction: column; gap: var(--sp-8); }
    .field__label { font: 500 .875rem/1.25rem var(--font); color: var(--text-primary); }
    .input {
      width: 100%; min-height: 3rem; height: 3rem; padding: 0 var(--sp-16);
      font: 400 1rem/1.5rem var(--font); color: var(--text-primary);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
      transition: border-color .15s ease, box-shadow .15s ease;
      appearance: none; -webkit-appearance: none;
    }
    .input::placeholder { color: var(--text-placeholder); }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-8);
      min-height: 3rem; height: 3rem; padding: 0 var(--sp-24);
      font: 500 1rem/1.5rem var(--font);
      border: 1px solid transparent; border-radius: var(--radius-md);
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background-color .15s ease, border-color .15s ease, transform .05s ease;
      box-sizing: border-box;
    }
    .btn--block { width: 100%; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--primary:active { background: var(--accent-active); transform: translateY(1px); }

    .stack-16 { display: flex; flex-direction: column; gap: var(--sp-16); }
    .auth-footer { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-8); margin-top: var(--sp-8); }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="index.html" class="icon-btn" aria-label="Back to Welcome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </a>
      <div class="app-header__title"></div>
      <div style="width: 2.75rem;"></div>
    </header>

    <main class="screen">
      <div>
        <h1 class="t-h1">Create account</h1>
        <p class="t-small t-muted" style="margin-top: var(--sp-4);">Join thousands of students managing money &amp; studies</p>
      </div>

      <div class="segmented" role="tablist" aria-label="Authentication mode">
        <button type="button" role="tab" aria-selected="true">Sign Up</button>
        <button type="button" role="tab" aria-selected="false">Log In</button>
      </div>

      <form class="stack-16" action="privacy.html" method="get">
        <div class="field">
          <label class="field__label" for="login-id">Email or phone</label>
          <input class="input" type="text" id="login-id" name="login_id" placeholder="student@college.edu or 9876543210" required autocomplete="username">
        </div>

        <div class="field">
          <label class="field__label" for="password">Password or OTP</label>
          <input class="input" type="password" id="password" name="password" placeholder="Enter password or OTP" required autocomplete="current-password">
        </div>

        <a href="privacy.html" class="btn btn--primary btn--block">Continue</a>
      </form>

      <div class="auth-footer">
        <a href="privacy.html" class="link t-small">Keep data only on this phone</a>
        <p class="t-small t-muted">No account needed. Your data never leaves your device.</p>
      </div>
    </main>
  </div>
</body>
</html>
