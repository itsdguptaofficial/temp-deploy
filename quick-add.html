<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Add · Super App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Surfaces */
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --surface-sunken: #F2F2F2;
      --surface-hover: #F5F5F5;
      --surface-active: #EDEDED;

      /* Borders */
      --border: #EAEAEA;
      --border-strong: #D4D4D4;
      --border-control: #A3A3A3;

      /* Text */
      --text-primary: #111111;
      --text-secondary: #5C5C5C;
      --text-placeholder: #737373;

      /* Accent (the only brand color) */
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-active: #1E40AF;
      --accent-soft: #EFF4FF;
      --accent-text: #1D4ED8;
      --accent-ring: rgba(37, 99, 235, 0.20);
      --on-accent: #FFFFFF;

      /* Status */
      --success: #15803D;
      --success-soft: #F0FDF4;
      --error: #B91C1C;
      --error-soft: #FEF2F2;
      --error-ring: rgba(185, 28, 28, 0.18);

      /* Disabled */
      --disabled-bg: #F2F2F2;
      --disabled-text: #8A8A8A;

      /* Effects */
      --scrim: rgba(0, 0, 0, 0.40);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, 0.08);

      /* Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 999px;

      /* Spacing */
      --sp-4: 0.25rem;
      --sp-8: 0.5rem;
      --sp-12: 0.75rem;
      --sp-16: 1rem;
      --sp-24: 1.5rem;
      --sp-32: 2rem;
      --sp-48: 3rem;
      --nav-h: 4rem;

      --font: "Inter", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A0A0A;
        --surface: #141414;
        --surface-sunken: #1F1F1F;
        --surface-hover: #1A1A1A;
        --surface-active: #262626;
        --border: #262626;
        --border-strong: #3A3A3A;
        --border-control: #6B6B6B;
        --text-primary: #EDEDED;
        --text-secondary: #A3A3A3;
        --text-placeholder: #8A8A8A;
        --accent: #60A5FA;
        --accent-hover: #93C5FD;
        --accent-active: #BFDBFE;
        --accent-soft: #16233F;
        --accent-text: #93C5FD;
        --accent-ring: rgba(96, 165, 250, 0.30);
        --on-accent: #0A0A0A;
        --success: #4ADE80;
        --success-soft: #0F2A1A;
        --error: #F87171;
        --error-soft: #331416;
        --error-ring: rgba(248, 113, 113, 0.25);
        --disabled-bg: #1F1F1F;
        --disabled-text: #6B6B6B;
        --scrim: rgba(0, 0, 0, 0.60);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.40);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.40);
        --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, 0.50);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0A0A0A;
      --surface: #141414;
      --surface-sunken: #1F1F1F;
      --surface-hover: #1A1A1A;
      --surface-active: #262626;
      --border: #262626;
      --border-strong: #3A3A3A;
      --border-control: #6B6B6B;
      --text-primary: #EDEDED;
      --text-secondary: #A3A3A3;
      --text-placeholder: #8A8A8A;
      --accent: #60A5FA;
      --accent-hover: #93C5FD;
      --accent-active: #BFDBFE;
      --accent-soft: #16233F;
      --accent-text: #93C5FD;
      --accent-ring: rgba(96, 165, 250, 0.30);
      --on-accent: #0A0A0A;
      --success: #4ADE80;
      --success-soft: #0F2A1A;
      --error: #F87171;
      --error-soft: #331416;
      --error-ring: rgba(248, 113, 113, 0.25);
      --disabled-bg: #1F1F1F;
      --disabled-text: #6B6B6B;
      --scrim: rgba(0, 0, 0, 0.60);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.40);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.40);
      --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, 0.50);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 100%; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font: 400 1rem/1.5rem var(--font);
      -webkit-font-smoothing: antialiased;
    }
    .num { font-variant-numeric: tabular-nums; }
    button, input, select, textarea { font: inherit; color: inherit; }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
    }
    @media (min-width: 480px) {
      body { background: var(--surface-sunken); }
      .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }

    .screen {
      padding: 0 var(--sp-16) var(--sp-24);
      display: flex;
      flex-direction: column;
      gap: var(--sp-24);
      filter: blur(1px);
      pointer-events: none;
      user-select: none;
    }
    .screen--nav {
      padding-bottom: calc(var(--nav-h) + var(--sp-24) + env(safe-area-inset-bottom, 0px));
    }

    .app-header {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12);
      min-height: 3.5rem; padding: var(--sp-8) var(--sp-16); margin: 0 calc(var(--sp-16) * -1);
    }
    .greeting { display: flex; flex-direction: column; }
    .icon-btn {
      display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem;
      background: transparent; color: var(--text-primary); border: 0; border-radius: var(--radius-full);
    }
    .icon-btn svg { width: 24px; height: 24px; }

    .t-display { font: 600 2.5rem/3rem var(--font); letter-spacing: -0.0625rem; font-variant-numeric: tabular-nums; }
    h1, .t-h1 { font: 600 1.75rem/2.125rem var(--font); letter-spacing: -0.0375rem; margin: 0; }
    h2, .t-h2 { font: 600 1.375rem/1.75rem var(--font); letter-spacing: -0.025rem; margin: 0; }
    h3, .t-h3 { font: 600 1.0625rem/1.5rem var(--font); letter-spacing: -0.0125rem; margin: 0; }
    p { margin: 0; }
    .t-small { font: 400 0.875rem/1.25rem var(--font); }
    .t-caption { font: 500 0.75rem/1rem var(--font); letter-spacing: 0.0125rem; }
    .t-muted { color: var(--text-secondary); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: var(--sp-16);
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: var(--sp-12);
    }
    .card--hero { padding: var(--sp-24); border-radius: var(--radius-lg); gap: var(--sp-16); }
    .card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12); }

    .progress { height: .5rem; background: var(--surface-sunken); border-radius: var(--radius-full); overflow: hidden; }
    .progress__bar { height: 100%; width: var(--value, 0%); background: var(--accent); border-radius: var(--radius-full); }

    .ring { --value: 0; position: relative; display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--value) * 1%), var(--surface-sunken) 0); flex: none; }
    .ring::before { content: ""; position: absolute; inset: .375rem; border-radius: 50%; background: var(--surface); }
    .ring__label { position: relative; font: 600 .875rem/1.25rem var(--font); font-variant-numeric: tabular-nums; }

    .list { list-style: none; margin: 0; padding: 0; }
    .list--borderless { border: 0; box-shadow: none; background: transparent; }
    .row { display: flex; align-items: center; gap: var(--sp-12); min-height: 3.5rem; padding: var(--sp-8) 0; }
    .row + .row { border-top: 1px solid var(--border); }
    .row__body { flex: 1; min-width: 0; }
    .row__title { font: 500 1rem/1.5rem var(--font); }
    .row--done .row__title { color: var(--text-secondary); text-decoration: line-through; }

    .badge {
      display: inline-flex; align-items: center; height: 1.5rem; padding: 0 var(--sp-8);
      border-radius: var(--radius-full); font: 500 .75rem/1rem var(--font); letter-spacing: .0125rem;
      background: var(--surface-sunken); color: var(--text-secondary);
    }

    .strip { display: flex; align-items: center; gap: var(--sp-12); min-height: 3rem; padding: var(--sp-12) var(--sp-16); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .strip__body { flex: 1; min-width: 0; }
    .strip svg { width: 20px; height: 20px; color: var(--text-secondary); }

    /* Bottom Sheet & Scrim */
    .scrim {
      position: fixed; inset: 0; background: var(--scrim); z-index: 30;
      display: block; text-decoration: none;
    }
    .sheet {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 31;
      width: min(100%, 430px); max-height: 90dvh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border); border-bottom: 0;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-sheet);
      padding: var(--sp-8) var(--sp-16) calc(var(--sp-24) + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: var(--sp-16);
    }
    .sheet__handle { width: 2.5rem; height: .25rem; border-radius: var(--radius-full); background: var(--border-strong); margin: 0 auto; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-12); }
    .option {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: var(--sp-12);
      min-height: 7.5rem; padding: var(--sp-16); background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm); color: var(--text-primary); text-align: left;
      font: 600 1rem/1.5rem var(--font); cursor: pointer; text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .option:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .option .row__icon {
      display: grid; place-items: center; width: 2.75rem; height: 2.75rem;
      border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-text);
    }
    .option .row__icon svg { width: 22px; height: 22px; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-8);
      min-height: 3rem; height: 3rem; padding: 0 var(--sp-24);
      font: 500 1rem/1.5rem var(--font);
      border: 1px solid transparent; border-radius: var(--radius-md);
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background-color .15s ease, border-color .15s ease, transform .05s ease;
      box-sizing: border-box;
    }
    .btn--block { width: 100%; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn--ghost { background: transparent; color: var(--text-secondary); }
    .btn--ghost:hover { background: var(--surface-hover); color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Dimmed home background -->
    <div class="screen screen--nav" aria-hidden="true">
      <header class="app-header">
        <div class="greeting">
          <span class="t-small t-muted">Good evening</span>
          <span class="t-h1">Divyansh</span>
        </div>
        <div class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      </header>

      <div class="card card--hero">
        <p class="t-small t-muted">Money left this month</p>
        <p class="t-display">₹ 4,850</p>
        <p class="t-small t-muted num">10 days left · about ₹485/day</p>
        <div class="progress" style="--value: 62%;">
          <div class="progress__bar"></div>
        </div>
      </div>

      <div class="card">
        <div class="card__head">
          <div>
            <span class="t-h3">Today's Top 3</span>
            <p class="t-small t-muted">1 task remaining</p>
          </div>
          <div class="ring" style="--value: 66;">
            <span class="ring__label">2/3</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Scrim backdrop -->
    <a href="home.html" class="scrim" aria-label="Close Quick Add sheet"></a>

    <!-- Unified Quick Add Sheet -->
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="quick-add-title">
      <div class="sheet__handle" aria-hidden="true"></div>

      <h2 class="t-h2" id="quick-add-title">Quick add</h2>

      <div class="grid-2">
        <a href="add-expense.html" class="option" id="opt-expense">
          <div class="row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
              <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
            </svg>
          </div>
          <span>Add Expense</span>
        </a>

        <a href="quick-capture.html" class="option" id="opt-task">
          <div class="row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 17 2 2 4-4"/>
              <path d="m3 7 2 2 4-4"/>
              <path d="M13 6h8"/>
              <path d="M13 12h8"/>
              <path d="M13 18h8"/>
            </svg>
          </div>
          <span>Add Task</span>
        </a>
      </div>

      <a href="home.html" class="btn btn--ghost btn--block">Cancel</a>
    </section>
  </div>
</body>
</html>
